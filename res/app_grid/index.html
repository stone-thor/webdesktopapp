<!DOCTYPE HTML>

<head>
	<title>app_bar</title>
	<meta http-equiv="content-type" content="text/html;charset=utf-8" />    
    <meta http-equiv="Content-Language" content="en-us">    

    <style type="text/css">      
      @import url("default.css");
    </style>

</head>

<body>

<script>
    console.log("initjs")
    document.addEventListener('pluginsinitialized', function() {
        console.log("ran")
        pywebview.api.getMenuEntries().then( 
            function (result){ 
                var span = document.getElementById('debug-out')
                span.innerHTML = JSON.stringify(result)
            }
        )
    })
</script>

<script>
    var config = {
        Left: 0,
        Top: 90,
        Width: 75,
        Height: 300,
        plugin: 'jsApi'
    };
</script>

<div class="bar">
    <span id="debug-out" style="font-weight: bold"> FOO </span>
    <div class="sm"><a class="sm" title="close" href="" appCmd="quit">&Cross;</a></div>
</div>
<p>hello</p>

</body>


</html>
